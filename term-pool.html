<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>語詞庫</title>
  <style>
    @font-face {
      font-family: "BpmfZihiKaiStd";
      src: url("fonts/BpmfZihiKaiStd/BpmfZihiKaiStd-Regular.ttf") format("truetype");
      font-display: block;
    }
    :root {
      --ink: #1c2430;
      --muted: #4a5568;
      --accent: #0f766e;
      --line: rgba(28, 36, 48, 0.12);
      --pane-bg: rgba(255, 252, 247, 0.96);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--ink);
      background: linear-gradient(160deg, #efe8d8, #f6f1e7 45%, #e7eef0);
    }
    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 1.25rem 1.1rem 2.5rem;
    }
    h1 { margin: 0 0 0.35rem; font-size: 1.55rem; }
    .sub { margin: 0 0 0.4rem; color: var(--muted); }
    .hint { margin: 0 0 0.75rem; color: var(--accent); font-size: 0.92rem; }
    .status { margin: 0 0 0.85rem; min-height: 1.2rem; color: #b45309; font-size: 0.9rem; }
    .actions button, .term {
      border: 0;
      border-radius: 999px;
      padding: 0.5rem 0.85rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .actions .primary {
      background: var(--accent);
      color: #fff;
    }
    .actions .ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      margin-bottom: 1rem;
    }
    .term {
      font-family: "BpmfZihiKaiStd", "標楷體", serif;
      font-size: 1.4rem;
      font-weight: 400;
      line-height: 1.85;
      padding: 0.45rem 0.75rem 0.3rem;
      border-radius: 12px;
      background: var(--pane-bg);
      border: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(28,36,48,0.08);
      color: inherit;
    }
    .term:hover { border-color: var(--accent); transform: translateY(-1px); }
    .term.active { background: #d7f0ec; border-color: var(--accent); }
    .term.saved { box-shadow: inset 0 0 0 2px rgba(15,118,110,0.35); }
    .empty { color: var(--muted); }
    .detail {
      display: none;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--pane-bg);
      padding: 0.9rem;
      box-shadow: 0 12px 30px rgba(28,36,48,0.08);
    }
    .detail.show { display: grid; gap: 0.7rem; }
    .detail-term-row {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }
    .detail h2 {
      margin: 0;
      font-family: "BpmfZihiKaiStd", "標楷體", serif;
      font-size: 1.65rem;
      font-weight: 400;
      line-height: 1.75;
    }
    .source { margin: 0; color: var(--muted); font-size: 0.86rem; }
    .fields { display: grid; gap: 0.5rem; }
    .field {
      display: grid;
      gap: 0.12rem;
      padding: 0.5rem 0.6rem;
      border-radius: 10px;
      background: rgba(15, 118, 110, 0.06);
    }
    .field-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
    }
    .field .label {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.04em;
    }
    .field .value { font-size: 0.96rem; line-height: 1.5; white-space: pre-wrap; }
    .tts-btn {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      width: 2rem;
      height: 2rem;
      padding: 0;
      background: #fff;
      cursor: pointer;
      font-size: 0.95rem;
      line-height: 1;
    }
    .tts-btn:hover { background: #e3f2fd; border-color: #90caf9; }
    .tts-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .speak-stage {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: rgba(28, 36, 48, 0.42);
      backdrop-filter: blur(3px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }
    .speak-stage.show {
      opacity: 1;
      pointer-events: auto;
    }
    .speak-stage-card {
      max-width: min(920px, 94vw);
      max-height: min(80vh, 720px);
      overflow: auto;
      padding: 1.6rem 1.8rem;
      border-radius: 18px;
      background: rgba(255, 252, 247, 0.98);
      border: 1px solid var(--line);
      box-shadow: 0 24px 60px rgba(28, 36, 48, 0.28);
      text-align: center;
      animation: speakPop 220ms ease both;
    }
    .speak-stage-card.zh {
      font-family: "BpmfZihiKaiStd", "標楷體", serif;
      font-size: clamp(2.4rem, 7vw, 4.6rem);
      font-weight: 400;
      line-height: 1.55;
      letter-spacing: 0.04em;
    }
    .speak-stage-card.en {
      font-family: "Noto Sans TC", "PingFang TC", "Helvetica Neue", sans-serif;
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      font-weight: 700;
      line-height: 1.45;
    }
    @keyframes speakPop {
      from { opacity: 0; transform: scale(0.92) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    #geminiPaste {
      width: 100%;
      min-height: 84px;
      padding: 0.65rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
      resize: vertical;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 0.45rem; }
  </style>
</head>
<body>
  <main>
      <h1>語詞庫</h1>
      <p id="sub" class="sub">共 0 個語詞</p>
      <p class="hint">點選語詞：已建檔則顯示試算表內容；尚未建檔則請 Gemini 生成後貼回儲存。</p>

      <p id="status" class="status"></p>
      <div id="list" class="list"></div>

      <section id="detail" class="detail">
        <div class="detail-term-row">
          <h2 id="detailTerm"></h2>
          <button id="detailTermSpeak" class="tts-btn" type="button" title="朗讀語詞" hidden>🔊</button>
        </div>
        <p id="detailSource" class="source"></p>
        <div id="fields" class="fields"></div>
        <div id="geminiBox" hidden>
          <label for="geminiPaste"><strong>貼上 Gemini 回覆</strong>（一行，欄位用 # 分隔）</label>
          <textarea id="geminiPaste" placeholder="語詞#解釋#解釋英#短句1#短句1英#短句2#短句2英#長句1#長句1英#長句2#長句2英"></textarea>
          <div class="actions">
            <button id="askGeminiBtn" class="primary" type="button">請 Gemini 生成</button>
            <button id="saveSheetBtn" class="primary" type="button">儲存到試算表</button>
            <button id="copyRowBtn" class="ghost" type="button">複製列（手動貼上）</button>
          </div>
        </div>
      </section>
  </main>

  <div id="speakStage" class="speak-stage" hidden>
    <div id="speakStageCard" class="speak-stage-card zh" role="status" aria-live="polite"></div>
  </div>

  <script>
    const GEMINI_URL = "https://gemini.google.com/app";
    const SEND_TO_GEMINI_ID = "gklmoobnblcdiglifjmdilofgndghmml";
    const STORAGE_KEY = "wordpuzzle-term-pool";
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbwHVQR9YqERjeG3Fg3MdOH8OHKGXLIGR3V9bV204P2IFr6YwPV5g9rb8MRS1VzobGV0/exec";
    const BANK_SHEET_ID = "12tOoECKZELXUdhrJzTQP3h0DgDmS4oM80DdIvIGLpGM";
    const BANK_GID = "257311027";

    const FIELD_LABELS = [
      "語詞", "解釋", "解釋英", "短句1", "短句1英", "短句2", "短句2英",
      "長句1", "長句1英", "長句2", "長句2英",
    ];

    let geminiWin = null;
    let askLock = false;
    let bankMap = new Map();
    let currentTerm = "";
    let currentCols = null;
    let currentPrompt = "";
    const GEMINI_WIN_NAME = "wordpuzzleGemini";

    const els = {
      status: document.getElementById("status"),
      list: document.getElementById("list"),
      sub: document.getElementById("sub"),
      detail: document.getElementById("detail"),
      detailTerm: document.getElementById("detailTerm"),
      detailTermSpeak: document.getElementById("detailTermSpeak"),
      detailSource: document.getElementById("detailSource"),
      fields: document.getElementById("fields"),
      geminiBox: document.getElementById("geminiBox"),
      geminiPaste: document.getElementById("geminiPaste"),
      askGeminiBtn: document.getElementById("askGeminiBtn"),
      saveSheetBtn: document.getElementById("saveSheetBtn"),
      copyRowBtn: document.getElementById("copyRowBtn"),
      speakStage: document.getElementById("speakStage"),
      speakStageCard: document.getElementById("speakStageCard"),
    };

    function plainTerm(term) {
      return String(term || "")
        .replace(/[\uFE00-\uFE0F]/g, "")
        .replace(/[\u{E0100}-\u{E01EF}]/gu, "")
        .replace(/[\u200B-\u200D\uFEFF]/g, "")
        .trim();
    }

    function buildPrompt(term) {
      const word = plainTerm(term);
      return (
        "你是一位中文老師要備課語詞造句練習，不用注音。" +
        "並且要把查詢結果貼回試算表A~K列，所以欄位都用#隔開。" +
        "A語詞、B解釋、C解釋英、D短句1、E短句1英、F短句2、G短句2英、H長句1、I長句1英、J長句2、K長句2英。" +
        `語詞是"${word}"。` +
        "請只輸出一行，共11個欄位，用#分隔；A欄必須是該語詞本身，不要標題、不要換行。"
      );
    }

    function bankKey(term) {
      return plainTerm(term);
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (e) {}
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        return ok;
      } catch (e) {
        return false;
      }
    }

    /** 沒有擴充功能時，只開／重用一個 Gemini（同分頁名稱，不另開多個） */
    function openGeminiFallback() {
      if (geminiWin && !geminiWin.closed) {
        try {
          geminiWin.focus();
        } catch (e) {}
        return geminiWin;
      }
      geminiWin = window.open(GEMINI_URL, GEMINI_WIN_NAME);
      return geminiWin;
    }

    function trySendToGeminiExtension(prompt) {
      return new Promise((resolve) => {
        let settled = false;
        const done = (result) => {
          if (settled) return;
          settled = true;
          resolve(result);
        };
        try {
          if (!window.chrome?.runtime?.sendMessage) {
            done({ sent: false, noExtension: true });
            return;
          }
          chrome.runtime.sendMessage(
            SEND_TO_GEMINI_ID,
            { type: "autofill", prompt, autoSubmit: true },
            (response) => {
              if (chrome.runtime.lastError) {
                done({ sent: false, noExtension: true });
                return;
              }
              done({
                sent: !!(response && response.success !== false),
                noExtension: false,
              });
            }
          );
          // 逾時：擴充功能可能仍在開 Gemini，不要再另開空視窗
          setTimeout(() => done({ sent: false, noExtension: false }), 2000);
        } catch (e) {
          done({ sent: false, noExtension: true });
        }
      });
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];
        if (inQuotes) {
          if (ch === '"' && next === '"') {
            cell += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            cell += ch;
          }
          continue;
        }
        if (ch === '"') inQuotes = true;
        else if (ch === ",") {
          row.push(cell);
          cell = "";
        } else if (ch === "\n") {
          row.push(cell);
          rows.push(row);
          row = [];
          cell = "";
        } else if (ch !== "\r") {
          cell += ch;
        }
      }
      if (cell.length || row.length) {
        row.push(cell);
        rows.push(row);
      }
      return rows;
    }

    async function loadBankFromSheet() {
      const url =
        `https://docs.google.com/spreadsheets/d/${BANK_SHEET_ID}/gviz/tq?tqx=out:csv&gid=${BANK_GID}`;
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error(`讀取語詞庫失敗 HTTP ${res.status}`);
      const rows = parseCsv(await res.text());
      const map = new Map();
      for (let i = 0; i < rows.length; i++) {
        const cols = rows[i].slice(0, 11);
        const term = plainTerm(cols[0] || "");
        if (!term || term === "語詞") continue;
        while (cols.length < 11) cols.push("");
        cols[0] = term;
        map.set(term, cols.map((c) => String(c || "").trim()));
      }
      bankMap = map;
      markSavedTerms();
      return map;
    }

    function loadPoolTerms() {
      try {
        const raw = sessionStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed.filter(Boolean) : [];
      } catch {
        return [];
      }
    }

    function markSavedTerms() {
      document.querySelectorAll(".term").forEach((btn) => {
        const key = bankKey(btn.dataset.term || "");
        btn.classList.toggle("saved", bankMap.has(key));
      });
    }

    function pickVoice() {
      if (!("speechSynthesis" in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      if (!voices || !voices.length) return null;
      const zh = voices.filter((v) =>
        (v.lang || "").toLowerCase().startsWith("zh-tw")
      );
      if (zh.length) {
        const m = zh.find(
          (v) =>
            v.name.includes("美佳") ||
            v.name.toLowerCase().includes("meijia")
        );
        return m || zh[0];
      }
      return (
        voices.find((v) => (v.lang || "").toLowerCase().startsWith("zh")) ||
        voices[0]
      );
    }

    let speakHideTimer = null;
    let speakToken = 0;

    function showSpeakStage(text, isEnglish) {
      const t = String(text || "").trim();
      if (!t) return;
      els.speakStage.hidden = false;
      els.speakStageCard.textContent = t;
      els.speakStageCard.classList.toggle("zh", !isEnglish);
      els.speakStageCard.classList.toggle("en", !!isEnglish);
      // 下一幀再加 class，讓 transition 生效
      requestAnimationFrame(() => {
        els.speakStage.classList.add("show");
      });
    }

    function hideSpeakStage() {
      els.speakStage.classList.remove("show");
      if (speakHideTimer) clearTimeout(speakHideTimer);
      speakHideTimer = setTimeout(() => {
        els.speakStage.hidden = true;
        els.speakStageCard.textContent = "";
      }, 200);
    }

    /** 與 dictation_exam 相同：美佳 / zh-TW，rate 0.8；同時放大顯示內容 */
    function speak(text, isEnglish) {
      if (!("speechSynthesis" in window)) return;
      let t = String(text || "")
        .replace(/[\uFE00-\uFE0F]/g, "")
        .replace(/[\u{E0100}-\u{E01EF}]/gu, "")
        .replace(/（空）/g, "")
        .trim();
      if (!t) return;
      const token = ++speakToken;
      window.speechSynthesis.cancel();
      showSpeakStage(t, !!isEnglish);
      const u = new SpeechSynthesisUtterance(t);
      u.lang = isEnglish ? "en-US" : "zh-TW";
      u.rate = 0.8;
      const v = pickVoice();
      if (v) u.voice = v;
      const finish = () => {
        if (token === speakToken) hideSpeakStage();
      };
      u.onend = finish;
      u.onerror = finish;
      window.speechSynthesis.speak(u);
    }

    els.speakStage.addEventListener("click", () => {
      speakToken += 1;
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      hideSpeakStage();
    });

    function makeSpeakBtn(text, isEnglish, title) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tts-btn";
      btn.title = title || "朗讀";
      btn.textContent = "🔊";
      const ok = String(text || "").trim() && String(text).trim() !== "（空）";
      btn.disabled = !ok;
      if (ok) {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          speak(text, !!isEnglish);
        });
      }
      return btn;
    }

    function isEnglishField(label) {
      return /英$/.test(label) || label === "解釋英";
    }

    function renderFields(cols) {
      els.fields.innerHTML = "";
      FIELD_LABELS.forEach((label, i) => {
        if (i === 0) return;
        const text = cols[i] || "";
        const wrap = document.createElement("div");
        wrap.className = "field";

        const head = document.createElement("div");
        head.className = "field-head";
        const lab = document.createElement("div");
        lab.className = "label";
        lab.textContent = label;
        head.appendChild(lab);
        head.appendChild(
          makeSpeakBtn(text, isEnglishField(label), `朗讀${label}`)
        );

        const val = document.createElement("div");
        val.className = "value";
        val.textContent = text || "（空）";

        wrap.appendChild(head);
        wrap.appendChild(val);
        els.fields.appendChild(wrap);
      });
    }

    function showDetail(term, cols, source, needGemini) {
      currentTerm = term;
      currentCols = cols ? cols.slice(0, 11) : null;
      els.detail.classList.add("show");
      els.detailTerm.textContent = term;
      els.detailSource.textContent = source;

      const speakTerm = plainTerm(cols && cols[0] ? cols[0] : term);
      els.detailTermSpeak.hidden = !speakTerm;
      els.detailTermSpeak.disabled = !speakTerm;
      els.detailTermSpeak.onclick = () => speak(speakTerm, false);

      if (cols) renderFields(cols);
      else els.fields.innerHTML = "";
      els.geminiBox.hidden = !needGemini;
      if (needGemini) {
        els.geminiPaste.value = "";
        els.geminiPaste.focus();
      }
    }

    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = () => pickVoice();
      pickVoice();
    }

    function parseHashRow(raw, fallbackTerm) {
      let text = String(raw || "").trim();
      text = text.replace(/^```[\w]*\n?/m, "").replace(/\n?```$/m, "").trim();
      const line =
        text.split(/\n/).map((l) => l.trim()).find((l) => l.includes("#")) ||
        text.split(/\n/).map((l) => l.trim()).filter(Boolean)[0] ||
        "";
      let parts = line.split("#").map((p) => p.trim());
      if (parts.length === 1 && line.includes("\t")) {
        parts = line.split("\t").map((p) => p.trim());
      }
      while (parts.length < 11) parts.push("");
      parts = parts.slice(0, 11);
      if (!plainTerm(parts[0])) parts[0] = plainTerm(fallbackTerm);
      else parts[0] = plainTerm(parts[0]);
      return parts;
    }

    async function askGemini(term) {
      if (askLock) return;
      askLock = true;
      try {
        currentPrompt = buildPrompt(term);
        const copied = await copyText(currentPrompt);

        // 先讓「Send to Gemini」開「已發問」的那扇；不要先開空的 Gemini
        const result = await trySendToGeminiExtension(currentPrompt);
        if (result.sent) {
          if (geminiWin && !geminiWin.closed) {
            try {
              geminiWin.close();
            } catch (e) {}
            geminiWin = null;
          }
          els.status.textContent =
            `已向 Gemini 送出「${plainTerm(term)}」。完成後把一行結果貼回下方儲存。`;
          return;
        }

        // 擴充功能存在但回覆慢／未確認：可能已開出發問視窗，不要再開空白的
        if (!result.noExtension) {
          els.status.textContent = copied
            ? `已請擴充功能送出「${plainTerm(term)}」。請看 Gemini；完成後貼回下方儲存。`
            : `已請擴充功能處理「${plainTerm(term)}」。`;
          return;
        }

        // 沒有擴充功能：開一個 Gemini 供手動貼上
        const win = openGeminiFallback();
        if (!win) {
          els.status.textContent =
            "無法自動送出，且彈出視窗被擋。請允許彈出式視窗，或安裝 Send to Gemini。";
          return;
        }
        els.status.textContent = copied
          ? `提示詞已複製。請在 Gemini 貼上（${
              navigator.platform.includes("Mac") ? "Cmd" : "Ctrl"
            }+V）送出。`
          : "無法自動複製提示詞，請再試一次。";
      } finally {
        askLock = false;
      }
    }

    async function saveToSheet(cols) {
      const payload = JSON.stringify({ action: "append", cols });
      let data = null;
      let rawText = "";
      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: payload,
          redirect: "follow",
        });
        rawText = await res.text();
        if (res.status === 404 || /檔案不存在|does not exist|Sorry/i.test(rawText)) {
          throw new Error(
            "Apps Script 網址已失效（404）。請重新部署後更新程式內建網址。"
          );
        }
        try {
          data = JSON.parse(rawText);
        } catch {
          // 有時回轉址 HTML；稍後以試算表是否出現該列驗證
          data = null;
        }
      } catch (err) {
        if (err && err.message && err.message.includes("Apps Script")) throw err;
        // 跨網域被擋時無法確認；改以重讀試算表驗證，不樂觀假成功
      }
      if (data && data.ok === false) {
        throw new Error(data.error || "寫入失敗");
      }
      await new Promise((r) => setTimeout(r, 1200));
      try {
        await loadBankFromSheet();
      } catch (e) {}
      const key = cols[0];
      const saved = bankMap.get(key);
      const looksSaved = saved && saved.slice(1).some((c) => c);
      if (!looksSaved) {
        // 本機暫存方便繼續看，但不宣稱已進試算表
        bankMap.set(key, cols);
        markSavedTerms();
        throw new Error(
          "沒有寫進試算表。請稍後再試，或改用「複製列」手動貼上。"
        );
      }
      return data || { ok: true };
    }

    function renderPool(terms) {
      els.sub.textContent = `共 ${terms.length} 個語詞`;
      els.list.innerHTML = "";
      if (!terms.length) {
        els.list.innerHTML =
          '<p class="empty">語詞庫是空的，請先在遊戲中點選常用語詞加入。</p>';
        return;
      }
      terms.forEach((term) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "term";
        btn.dataset.term = term;
        btn.textContent = term;
        if (bankMap.has(bankKey(term))) btn.classList.add("saved");
        btn.addEventListener("click", async () => {
          document.querySelectorAll(".term").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          const key = bankKey(term);
          const cached = bankMap.get(key);
          if (cached && cached.slice(1).some((c) => c)) {
            showDetail(term, cached, "來源：試算表（已儲存，不需再問 Gemini）", false);
            els.status.textContent = `已載入「${plainTerm(term)}」的試算表資料。`;
            currentPrompt = "";
            return;
          }
          showDetail(term, null, "試算表尚無此語詞，請用 Gemini 生成後貼上儲存", true);
          els.status.textContent = `「${plainTerm(term)}」尚未建檔。`;
          await askGemini(term);
        });
        els.list.appendChild(btn);
      });
    }

    els.askGeminiBtn.addEventListener("click", () => {
      if (currentTerm) askGemini(currentTerm);
    });

    els.copyRowBtn.addEventListener("click", async () => {
      const cols =
        currentCols ||
        parseHashRow(els.geminiPaste.value, currentTerm);
      const ok = await copyText(cols.join("\t"));
      els.status.textContent = ok
        ? "已複製成試算表列（Tab 分隔），可直接貼到試算表。"
        : "複製失敗。";
    });

    els.saveSheetBtn.addEventListener("click", async () => {
      try {
        const cols = parseHashRow(els.geminiPaste.value, currentTerm);
        if (!cols[0]) throw new Error("找不到語詞");
        if (!cols.slice(1).some(Boolean)) {
          throw new Error("請先貼上 Gemini 回覆（# 分隔）");
        }
        els.status.textContent = "寫入試算表中…";
        await saveToSheet(cols);
        currentCols = cols;
        showDetail(currentTerm || cols[0], cols, "來源：剛寫入試算表", false);
        els.status.textContent = `已儲存「${cols[0]}」到試算表。`;
      } catch (err) {
        console.error(err);
        els.status.textContent = `儲存失敗：${err.message}`;
      }
    });

    async function pingScriptUrl(url) {
      if (!url) return false;
      try {
        const res = await fetch(url + (url.includes("?") ? "&" : "?") + "action=ping", {
          cache: "no-store",
        });
        const text = await res.text();
        if (res.status === 404 || /檔案不存在|does not exist|Sorry/i.test(text)) return false;
        const data = JSON.parse(text);
        return !!(data && data.ok);
      } catch {
        return false;
      }
    }

    async function init() {
      const terms = loadPoolTerms();
      renderPool(terms);
      els.status.textContent = "正在讀取試算表語詞庫…";
      try {
        await loadBankFromSheet();
        markSavedTerms();
        els.status.textContent = `試算表已載入 ${bankMap.size} 筆語詞資料。`;
      } catch (err) {
        console.error(err);
        els.status.textContent =
          "試算表讀取失敗（仍可請 Gemini 生成）。請確認試算表為「知道連結者可檢視/編輯」。";
      }
      const ok = await pingScriptUrl(SCRIPT_URL);
      if (!ok) {
        els.status.textContent +=
          " ※ 寫入服務連線異常，自動存檔可能失敗（仍可用「複製列」手動貼）。";
      }
    }

    init();
  </script>
</body>
</html>
