<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>語詞庫</title>
  <style>
    @font-face {
      font-family: "BpmfZihiKaiStd";
      src: url("fonts/BpmfZihiKaiStd/BpmfZihiKaiStd-Regular.ttf") format("truetype");
      font-display: block;
    }
    :root {
      --ink: #1c2430;
      --muted: #4a5568;
      --accent: #0f766e;
      --line: rgba(28, 36, 48, 0.12);
      --pane-bg: rgba(255, 252, 247, 0.96);
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: var(--ink);
      background: linear-gradient(160deg, #efe8d8, #f6f1e7 45%, #e7eef0);
    }
    main {
      max-width: 880px;
      margin: 0 auto;
      padding: 1.25rem 1.1rem 2.5rem;
    }
    h1 { margin: 0 0 0.35rem; font-size: 1.55rem; }
    .page-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 0.75rem;
      margin-bottom: 0.15rem;
      flex-wrap: wrap;
    }
    .page-head-text { min-width: 0; flex: 1; }
    .copy-all-btn {
      flex: 0 0 auto;
      border: 0;
      border-radius: 999px;
      padding: 0.55rem 0.95rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
      background: var(--accent);
      color: #fff;
      white-space: nowrap;
      box-shadow: 0 8px 20px rgba(15, 118, 110, 0.22);
    }
    .copy-all-btn:hover { filter: brightness(1.05); }
    .copy-all-btn:disabled {
      opacity: 0.55;
      cursor: default;
      filter: none;
    }
    .sub { margin: 0 0 0.4rem; color: var(--muted); }
    .hint { margin: 0 0 0.75rem; color: var(--accent); font-size: 0.92rem; }
    .status { margin: 0 0 0.85rem; min-height: 1.2rem; color: #b45309; font-size: 0.9rem; }
    .actions button, .term {
      border: 0;
      border-radius: 999px;
      padding: 0.5rem 0.85rem;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    .actions .primary {
      background: var(--accent);
      color: #fff;
    }
    .actions .ghost {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--muted);
    }
    .list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
      margin-bottom: 1rem;
    }
    .term {
      font-family: "BpmfZihiKaiStd", "標楷體", serif;
      font-size: 1.4rem;
      font-weight: 400;
      line-height: 1.85;
      padding: 0.45rem 0.75rem 0.3rem;
      border-radius: 12px;
      background: var(--pane-bg);
      border: 1px solid var(--line);
      box-shadow: 0 8px 24px rgba(28,36,48,0.08);
      color: inherit;
    }
    .term:hover { border-color: var(--accent); transform: translateY(-1px); }
    .term.active { background: #d7f0ec; border-color: var(--accent); }
    .term.saved { box-shadow: inset 0 0 0 2px rgba(15,118,110,0.35); }
    .empty { color: var(--muted); }
    .detail {
      display: none;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--pane-bg);
      padding: 0.9rem;
      box-shadow: 0 12px 30px rgba(28,36,48,0.08);
    }
    .detail.show { display: grid; gap: 0.7rem; }
    .detail-term-row {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      flex-wrap: wrap;
    }
    .detail h2 {
      margin: 0;
      font-family: "BpmfZihiKaiStd", "標楷體", serif;
      font-size: 1.65rem;
      font-weight: 400;
      line-height: 1.75;
    }
    .source { margin: 0; color: var(--muted); font-size: 0.86rem; }
    .fields { display: grid; gap: 0.5rem; }
    .field {
      display: grid;
      gap: 0.12rem;
      padding: 0.5rem 0.6rem;
      border-radius: 10px;
      background: rgba(15, 118, 110, 0.06);
    }
    .field-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
    }
    .field .label {
      font-size: 0.76rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: 0.04em;
    }
    .field .value { font-size: 0.96rem; line-height: 1.5; white-space: pre-wrap; }
    .field .value-zh {
      font-family: "BpmfZihiKaiStd", "標楷體", serif;
      line-height: 1.95;
      font-size: 1.15rem;
    }
    .tts-btn {
      flex: 0 0 auto;
      border: 1px solid var(--line);
      border-radius: 999px;
      width: 2rem;
      height: 2rem;
      padding: 0;
      background: #fff;
      cursor: pointer;
      font-size: 0.95rem;
      line-height: 1;
    }
    .tts-btn:hover { background: #e3f2fd; border-color: #90caf9; }
    .tts-btn:disabled {
      opacity: 0.35;
      cursor: default;
    }
    .speak-stage {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 1.5rem;
      background: rgba(28, 36, 48, 0.42);
      backdrop-filter: blur(3px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }
    .speak-stage.show {
      opacity: 1;
      pointer-events: auto;
    }
    .speak-stage-card {
      max-width: min(920px, 94vw);
      max-height: min(85vh, 780px);
      overflow: auto;
      padding: 2.2rem 1.8rem 1.6rem;
      border-radius: 18px;
      background: rgba(255, 252, 247, 0.98);
      border: 1px solid var(--line);
      box-shadow: 0 24px 60px rgba(28, 36, 48, 0.28);
      text-align: center;
      animation: speakPop 220ms ease both;
    }
    .speak-stage-card.zh {
      font-family: "BpmfZihiKaiStd", "標楷體", serif;
      font-size: clamp(2.4rem, 7vw, 4.6rem);
      font-weight: 400;
      line-height: 2.45;
      letter-spacing: 0.06em;
      padding-top: 2.6rem; /* 留給注音，避免被裁切 */
    }
    .speak-stage-card.zh .zh-cluster {
      font-family: inherit;
      font-size: inherit;
      line-height: inherit;
      display: inline-block;
      padding: 0.15em 0.02em;
      vertical-align: baseline;
    }
    .speak-stage-card.en {
      font-family: "Noto Sans TC", "PingFang TC", "Helvetica Neue", sans-serif;
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      font-weight: 700;
      line-height: 1.45;
    }
    @keyframes speakPop {
      from { opacity: 0; transform: scale(0.92) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    #geminiPaste {
      width: 100%;
      min-height: 84px;
      padding: 0.65rem;
      border: 1px solid var(--line);
      border-radius: 10px;
      font: inherit;
      resize: vertical;
    }
    .actions { display: flex; flex-wrap: wrap; gap: 0.45rem; }
    .gemini-help {
      margin: 0.35rem 0 0;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main>
      <div class="page-head">
        <div class="page-head-text">
          <h1>語詞庫</h1>
          <p id="sub" class="sub">共 0 個語詞</p>
        </div>
        <button id="copyAllBtn" class="copy-all-btn" type="button" title="複製本頁語詞的 A～K 欄，可貼到自己的試算表">
          全部複製到自己的試算表
        </button>
      </div>
      <p class="hint">點選語詞：已建檔則顯示試算表內容；尚未建檔則複製提示詞給 Gemini，貼回後儲存。右上角可一次複製本頁語詞的 A～K，貼到自己的試算表。</p>

      <p id="status" class="status"></p>
      <div id="list" class="list"></div>

      <section id="detail" class="detail">
        <div class="detail-term-row">
          <h2 id="detailTerm"></h2>
          <button id="detailTermSpeak" class="tts-btn" type="button" title="朗讀語詞" hidden>🔊</button>
        </div>
        <p id="detailSource" class="source"></p>
        <div id="fields" class="fields"></div>
        <div id="geminiBox" hidden>
          <label for="geminiPaste"><strong>貼上 Gemini 回覆</strong>（一行，欄位用 # 分隔）</label>
          <textarea id="geminiPaste" placeholder="語詞#解釋#解釋英#短句1#短句1英#短句2#短句2英#長句1#長句1英#長句2#長句2英"></textarea>
          <div class="actions">
            <button id="askGeminiBtn" class="primary" type="button">複製給 Gemini</button>
            <button id="toneozBtn" class="ghost" type="button">去澳聲通校正注音</button>
            <button id="saveSheetBtn" class="primary" type="button">覆蓋回試算表</button>
          </div>
          <p class="gemini-help">
            若要修改句子，可貼上新內容後按「覆蓋回試算表」更新原資料。
            若跳出的 Gemini 視窗裡沒有指令，請按「複製給 Gemini」，再到 Gemini 視窗貼上送出。
          </p>
        </div>
      </section>
  </main>

  <div id="speakStage" class="speak-stage" hidden>
    <div id="speakStageCard" class="speak-stage-card zh" role="status" aria-live="polite"></div>
  </div>

  <script>
    const GEMINI_URL = "https://gemini.google.com/app";
    const SEND_TO_GEMINI_ID = "gklmoobnblcdiglifjmdilofgndghmml";
    const STORAGE_KEY = "wordpuzzle-term-pool";
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbwyMiNBZn6HPuxdHSHKFHfGAQrLeuODLEQgupD3cD5rUXu-IczsZ-KSHxv9P5mao8BdTQ/exec";
    const BANK_SHEET_ID = "12tOoECKZELXUdhrJzTQP3h0DgDmS4oM80DdIvIGLpGM";
    const BANK_GID = "257311027";

    const FIELD_LABELS = [
      "語詞", "解釋", "解釋英", "短句1", "短句1英", "短句2", "短句2英",
      "長句1", "長句1英", "長句2", "長句2英",
    ];

    let geminiWin = null;
    let askLock = false;
    /** plainKey → 試算表 A 欄原文（僅索引，不含 B–K） */
    let bankIndex = new Map();
    /** plainKey → 完整 A–K（點選後才載入） */
    let bankDetails = new Map();
    let currentTerm = "";
    let currentCols = null;
    let currentPrompt = "";
    const GEMINI_WIN_NAME = "wordpuzzleGemini";

    const els = {
      status: document.getElementById("status"),
      list: document.getElementById("list"),
      sub: document.getElementById("sub"),
      detail: document.getElementById("detail"),
      detailTerm: document.getElementById("detailTerm"),
      detailTermSpeak: document.getElementById("detailTermSpeak"),
      detailSource: document.getElementById("detailSource"),
      fields: document.getElementById("fields"),
      geminiBox: document.getElementById("geminiBox"),
      geminiPaste: document.getElementById("geminiPaste"),
      askGeminiBtn: document.getElementById("askGeminiBtn"),
      toneozBtn: document.getElementById("toneozBtn"),
      saveSheetBtn: document.getElementById("saveSheetBtn"),
      copyAllBtn: document.getElementById("copyAllBtn"),
      speakStage: document.getElementById("speakStage"),
      speakStageCard: document.getElementById("speakStageCard"),
    };

    function plainTerm(term) {
      return String(term || "")
        .replace(/[\uFE00-\uFE0F]/g, "")
        .replace(/[\u{E0100}-\u{E01EF}]/gu, "")
        .replace(/[\u200B-\u200D\uFEFF]/g, "")
        .trim();
    }

    function buildPrompt(term) {
      const word = plainTerm(term);
      return (
        "你是一位中文老師要備課語詞造句練習，不用注音。" +
        "並且要把查詢結果貼回試算表A~K列，所以欄位都用#隔開。" +
        "A語詞、B解釋、C解釋英、D短句1、E短句1英、F短句2、G短句2英、H長句1、I長句1英、J長句2、K長句2英。" +
        `語詞是"${word}"。` +
        "請只輸出一行，共11個欄位，用#分隔；A欄必須是該語詞本身，不要標題、不要換行。"
      );
    }

    function bankKey(term) {
      return plainTerm(term);
    }

    async function copyText(text) {
      try {
        if (navigator.clipboard?.writeText) {
          await navigator.clipboard.writeText(text);
          return true;
        }
      } catch (e) {}
      try {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.setAttribute("readonly", "");
        ta.style.position = "fixed";
        ta.style.left = "-9999px";
        document.body.appendChild(ta);
        ta.select();
        const ok = document.execCommand("copy");
        document.body.removeChild(ta);
        return ok;
      } catch (e) {
        return false;
      }
    }

    /** 沒有擴充功能時，只開／重用一個 Gemini（同分頁名稱，不另開多個） */
    function openGeminiFallback() {
      if (geminiWin && !geminiWin.closed) {
        try {
          geminiWin.focus();
        } catch (e) {}
        return geminiWin;
      }
      geminiWin = window.open(GEMINI_URL, GEMINI_WIN_NAME);
      return geminiWin;
    }

    function trySendToGeminiExtension(prompt) {
      return new Promise((resolve) => {
        let settled = false;
        const done = (result) => {
          if (settled) return;
          settled = true;
          resolve(result);
        };
        try {
          if (!window.chrome?.runtime?.sendMessage) {
            done({ sent: false, noExtension: true });
            return;
          }
          chrome.runtime.sendMessage(
            SEND_TO_GEMINI_ID,
            { type: "autofill", prompt, autoSubmit: true },
            (response) => {
              if (chrome.runtime.lastError) {
                done({ sent: false, noExtension: true });
                return;
              }
              done({
                sent: !!(response && response.success !== false),
                noExtension: false,
              });
            }
          );
          // 逾時：擴充功能可能仍在開 Gemini，不要再另開空視窗
          setTimeout(() => done({ sent: false, noExtension: false }), 2000);
        } catch (e) {
          done({ sent: false, noExtension: true });
        }
      });
    }

    function parseCsv(text) {
      const rows = [];
      let row = [];
      let cell = "";
      let inQuotes = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        const next = text[i + 1];
        if (inQuotes) {
          if (ch === '"' && next === '"') {
            cell += '"';
            i++;
          } else if (ch === '"') {
            inQuotes = false;
          } else {
            cell += ch;
          }
          continue;
        }
        if (ch === '"') inQuotes = true;
        else if (ch === ",") {
          row.push(cell);
          cell = "";
        } else if (ch === "\n") {
          row.push(cell);
          rows.push(row);
          row = [];
          cell = "";
        } else if (ch !== "\r") {
          cell += ch;
        }
      }
      if (cell.length || row.length) {
        row.push(cell);
        rows.push(row);
      }
      return rows;
    }

    function gvizCsvUrl(tq) {
      const base = `https://docs.google.com/spreadsheets/d/${BANK_SHEET_ID}/gviz/tq?tqx=out:csv&gid=${BANK_GID}`;
      return tq ? `${base}&tq=${encodeURIComponent(tq)}` : base;
    }

    function escapeGvizString(s) {
      return String(s || "").replace(/\\/g, "\\\\").replace(/'/g, "''");
    }

    function normalizeBankCols(row, rawFallback) {
      const cols = (row || []).slice(0, 11).map((c) => String(c || "").trim());
      while (cols.length < 11) cols.push("");
      const rawTerm = String(cols[0] || rawFallback || "").trim();
      cols[0] = rawTerm;
      return cols;
    }

    /** 只讀 A 欄，建立「哪些語詞已建檔」索引 */
    async function loadBankIndexFromSheet() {
      const res = await fetch(gvizCsvUrl("select A"), { cache: "no-store" });
      if (!res.ok) throw new Error(`讀取語詞庫失敗 HTTP ${res.status}`);
      const rows = parseCsv(await res.text());
      const index = new Map();
      for (let i = 0; i < rows.length; i++) {
        const rawTerm = String((rows[i] && rows[i][0]) || "").trim();
        const key = plainTerm(rawTerm);
        if (!key || key === "語詞") continue;
        index.set(key, rawTerm);
      }
      bankIndex = index;
      // 清掉已不在表上的快取
      for (const k of [...bankDetails.keys()]) {
        if (!bankIndex.has(k)) bankDetails.delete(k);
      }
      markSavedTerms();
      return index;
    }

    /** 依 A 欄原文載入該列 A–K */
    async function loadBankDetailFromSheet(rawTerm) {
      const term = String(rawTerm || "").trim();
      if (!term) return null;
      const tq = `select A,B,C,D,E,F,G,H,I,J,K where A = '${escapeGvizString(term)}'`;
      const res = await fetch(gvizCsvUrl(tq), { cache: "no-store" });
      if (!res.ok) throw new Error(`讀取語詞列失敗 HTTP ${res.status}`);
      const rows = parseCsv(await res.text());
      const want = plainTerm(term);
      for (let i = 0; i < rows.length; i++) {
        const cols = normalizeBankCols(rows[i], term);
        const key = plainTerm(cols[0]);
        if (!key || key === "語詞") continue;
        if (key === want) return cols;
      }
      return null;
    }

    function rememberBankRow(cols) {
      const row = normalizeBankCols(cols);
      const key = bankKey(row[0]);
      if (!key) return key;
      bankIndex.set(key, row[0]);
      bankDetails.set(key, row);
      markSavedTerms();
      return key;
    }

    function tsvCell(value) {
      const s = String(value == null ? "" : value);
      if (/[\t\n\r"]/.test(s)) {
        return `"${s.replace(/"/g, '""')}"`;
      }
      return s;
    }

    function rowsToTsv(rows) {
      return rows.map((row) => row.map(tsvCell).join("\t")).join("\n");
    }

    /** 一次拉回整表 A–K，供「全部複製」使用（不影響平常懶載入） */
    async function loadAllBankRowsFromSheet() {
      const res = await fetch(
        gvizCsvUrl("select A,B,C,D,E,F,G,H,I,J,K"),
        { cache: "no-store" }
      );
      if (!res.ok) throw new Error(`讀取語詞庫失敗 HTTP ${res.status}`);
      const rows = parseCsv(await res.text());
      const map = new Map();
      for (let i = 0; i < rows.length; i++) {
        const cols = normalizeBankCols(rows[i]);
        const key = plainTerm(cols[0]);
        if (!key || key === "語詞") continue;
        map.set(key, cols);
        bankIndex.set(key, cols[0]);
        bankDetails.set(key, cols);
      }
      markSavedTerms();
      return map;
    }

    async function copyAllPoolToClipboard() {
      const terms = loadPoolTerms();
      if (!terms.length) {
        throw new Error("語詞庫是空的，請先在遊戲中加入語詞。");
      }
      els.copyAllBtn.disabled = true;
      els.status.textContent = "正在整理本頁語詞的 A～K…";
      const allRows = await loadAllBankRowsFromSheet();
      const out = [FIELD_LABELS.slice()];
      let hit = 0;
      let missing = 0;
      for (const term of terms) {
        const key = bankKey(term);
        const fromBank = allRows.get(key);
        if (fromBank) {
          out.push(fromBank.slice(0, 11));
          hit += 1;
        } else {
          const row = normalizeBankCols([term]);
          out.push(row);
          missing += 1;
        }
      }
      const text = rowsToTsv(out);
      const ok = await copyText(text);
      if (!ok) throw new Error("複製失敗，請再試一次。");
      els.status.textContent =
        missing > 0
          ? `已複製 ${hit} 筆完整資料（另 ${missing} 筆尚未建檔，僅含語詞）。請到自己的試算表貼上。`
          : `已複製 ${hit} 筆 A～K（含標題列）。請到自己的試算表貼上。`;
    }

    function markSavedTerms() {
      document.querySelectorAll(".term").forEach((btn) => {
        const key = bankKey(btn.dataset.term || "");
        btn.classList.toggle("saved", bankIndex.has(key));
      });
    }

    function loadPoolTerms() {
      try {
        const raw =
          localStorage.getItem(STORAGE_KEY) ||
          sessionStorage.getItem(STORAGE_KEY);
        const parsed = raw ? JSON.parse(raw) : [];
        return Array.isArray(parsed) ? parsed.filter(Boolean) : [];
      } catch {
        return [];
      }
    }

    function pickVoice() {
      if (!("speechSynthesis" in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      if (!voices || !voices.length) return null;
      const zh = voices.filter((v) =>
        (v.lang || "").toLowerCase().startsWith("zh-tw")
      );
      if (zh.length) {
        const m = zh.find(
          (v) =>
            v.name.includes("美佳") ||
            v.name.toLowerCase().includes("meijia")
        );
        return m || zh[0];
      }
      return (
        voices.find((v) => (v.lang || "").toLowerCase().startsWith("zh")) ||
        voices[0]
      );
    }

    let speakHideTimer = null;
    let speakToken = 0;

    function stripIvs(text) {
      return String(text || "")
        .replace(/[\uFE00-\uFE0F]/g, "")
        .replace(/[\u{E0100}-\u{E01EF}]/gu, "")
        .replace(/[\u200B-\u200D\uFEFF]/g, "")
        .replace(/（空）/g, "")
        .trim();
    }

    function hideSpeakStage() {
      els.speakStage.classList.remove("show");
      if (speakHideTimer) clearTimeout(speakHideTimer);
      speakHideTimer = setTimeout(() => {
        els.speakStage.hidden = true;
        els.speakStageCard.textContent = "";
      }, 200);
    }

    /** 美佳朗讀；放大畫面保留多音字 IVS */
    function speak(text, isEnglish) {
      if (!("speechSynthesis" in window)) return;
      const display = String(text || "")
        .replace(/（空）/g, "")
        .replace(/[\u200B-\u200D\uFEFF]/g, "")
        .trim();
      const forSpeech = isEnglish ? display : stripIvs(display);
      if (!display || (!isEnglish && !forSpeech)) return;
      const token = ++speakToken;
      window.speechSynthesis.cancel();
      showSpeakStage(display, !!isEnglish);
      const u = new SpeechSynthesisUtterance(forSpeech || display);
      u.lang = isEnglish ? "en-US" : "zh-TW";
      u.rate = 0.8;
      const v = pickVoice();
      if (v) u.voice = v;
      const finish = () => {
        if (token === speakToken) hideSpeakStage();
      };
      u.onend = finish;
      u.onerror = finish;
      window.speechSynthesis.speak(u);
    }

    els.speakStage.addEventListener("click", () => {
      speakToken += 1;
      if ("speechSynthesis" in window) window.speechSynthesis.cancel();
      hideSpeakStage();
    });

    function makeSpeakBtn(text, isEnglish, title) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "tts-btn";
      btn.title = title || "朗讀";
      btn.textContent = "🔊";
      const ok = String(text || "").trim() && String(text).trim() !== "（空）";
      btn.disabled = !ok;
      if (ok) {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          speak(text, !!isEnglish);
        });
      }
      return btn;
    }

    function isEnglishField(label) {
      return /英$/.test(label) || label === "解釋英";
    }

    function renderFields(cols) {
      els.fields.innerHTML = "";
      FIELD_LABELS.forEach((label, i) => {
        if (i === 0) return;
        const text = cols[i] || "";
        const wrap = document.createElement("div");
        wrap.className = "field";

        const head = document.createElement("div");
        head.className = "field-head";
        const lab = document.createElement("div");
        lab.className = "label";
        lab.textContent = label;
        head.appendChild(lab);
        head.appendChild(
          makeSpeakBtn(text, isEnglishField(label), `朗讀${label}`)
        );

        const val = document.createElement("div");
        val.className = "value" + (isEnglishField(label) ? "" : " value-zh");
        // 如實顯示試算表字串（含 IVS）
        val.textContent = text || "（空）";

        wrap.appendChild(head);
        wrap.appendChild(val);
        els.fields.appendChild(wrap);
      });
    }

    function showSpeakStage(text, isEnglish) {
      // 原樣顯示（含 IVS），不改字形
      const t = String(text || "")
        .replace(/（空）/g, "")
        .replace(/[\u200B-\u200D\uFEFF]/g, "")
        .trim();
      if (!t) return;
      els.speakStage.hidden = false;
      els.speakStageCard.classList.toggle("zh", !isEnglish);
      els.speakStageCard.classList.toggle("en", !!isEnglish);
      els.speakStageCard.textContent = t;
      requestAnimationFrame(() => {
        els.speakStage.classList.add("show");
      });
    }

    function showDetail(term, cols, source, needGemini) {
      currentTerm = term;
      currentCols = cols ? cols.slice(0, 11) : null;
      els.detail.classList.add("show");
      // 已存檔：以試算表 A 欄為準；尚未存檔：用語詞庫選取的字
      const displayTerm =
        cols && String(cols[0] || "").trim()
          ? String(cols[0]).trim()
          : term;
      els.detailTerm.textContent = displayTerm;
      els.detailSource.textContent = source;

      els.detailTermSpeak.hidden = !stripIvs(displayTerm);
      els.detailTermSpeak.disabled = !stripIvs(displayTerm);
      els.detailTermSpeak.onclick = () => speak(displayTerm, false);

      if (cols) renderFields(cols);
      else els.fields.innerHTML = "";

      // 無論是否已有資料，都顯示操作區，方便修改後覆蓋存檔
      els.geminiBox.hidden = false;
      if (cols && cols.slice(1).some((c) => String(c || "").trim())) {
        const row = cols.slice(0, 11);
        while (row.length < 11) row.push("");
        els.geminiPaste.value = row.join("#");
      } else {
        els.geminiPaste.value = "";
        if (needGemini) els.geminiPaste.focus();
      }
    }

    if ("speechSynthesis" in window) {
      window.speechSynthesis.onvoiceschanged = () => pickVoice();
      pickVoice();
    }

    function parseHashRow(raw, fallbackTerm) {
      let text = String(raw || "").trim();
      text = text.replace(/^```[\w]*\n?/m, "").replace(/\n?```$/m, "").trim();
      const line =
        text.split(/\n/).map((l) => l.trim()).find((l) => l.includes("#")) ||
        text.split(/\n/).map((l) => l.trim()).filter(Boolean)[0] ||
        "";
      let parts = line.split("#").map((p) => p.trim());
      if (parts.length === 1 && line.includes("\t")) {
        parts = line.split("\t").map((p) => p.trim());
      }
      while (parts.length < 11) parts.push("");
      parts = parts.slice(0, 11);
      // 保留貼上內容的 IVS；缺 A 欄才用選取語詞（同樣保留原字形）
      if (!String(parts[0] || "").trim()) {
        parts[0] = String(fallbackTerm || "").trim();
      }
      return parts;
    }

    async function askGemini(term) {
      if (askLock) return;
      askLock = true;
      try {
        currentPrompt = buildPrompt(term);
        const copied = await copyText(currentPrompt);

        // 先讓「Send to Gemini」開「已發問」的那扇；不要先開空的 Gemini
        const result = await trySendToGeminiExtension(currentPrompt);
        if (result.sent) {
          if (geminiWin && !geminiWin.closed) {
            try {
              geminiWin.close();
            } catch (e) {}
            geminiWin = null;
          }
          els.status.textContent =
            `已向 Gemini 送出「${plainTerm(term)}」。完成後把一行結果貼回下方儲存。`;
          return;
        }

        // 擴充功能存在但回覆慢／未確認：可能已開出發問視窗，不要再開空白的
        if (!result.noExtension) {
          els.status.textContent = copied
            ? `已請擴充功能送出「${plainTerm(term)}」。請看 Gemini；完成後貼回下方儲存。`
            : `已請擴充功能處理「${plainTerm(term)}」。`;
          return;
        }

        // 沒有擴充功能：開一個 Gemini 供手動貼上
        const win = openGeminiFallback();
        if (!win) {
          els.status.textContent =
            "無法自動送出，且彈出視窗被擋。請允許彈出式視窗，或安裝 Send to Gemini。";
          return;
        }
        els.status.textContent = copied
          ? `提示詞已複製。請在 Gemini 貼上（${
              navigator.platform.includes("Mac") ? "Cmd" : "Ctrl"
            }+V）送出。`
          : "無法自動複製提示詞，請再試一次。";
      } finally {
        askLock = false;
      }
    }

    function parseAppsScriptJson(text) {
      const raw = String(text || "").trim();
      if (!raw) return null;
      try {
        return JSON.parse(raw);
      } catch (e) {}
      // 有時夾在 HTML／轉址頁裡，擷取第一個含 "ok" 的 JSON 物件
      const start = raw.indexOf('{"ok"');
      if (start === -1) return null;
      let depth = 0;
      for (let i = start; i < raw.length; i++) {
        const ch = raw[i];
        if (ch === "{") depth += 1;
        else if (ch === "}") {
          depth -= 1;
          if (depth === 0) {
            try {
              return JSON.parse(raw.slice(start, i + 1));
            } catch (e) {
              return null;
            }
          }
        }
      }
      return null;
    }

    async function saveToSheet(cols) {
      const payload = JSON.stringify({ action: "append", cols });
      let data = null;
      let rawText = "";
      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: payload,
          redirect: "follow",
        });
        rawText = await res.text();
        if (res.status === 404 || /檔案不存在|does not exist|Sorry/i.test(rawText)) {
          throw new Error(
            "Apps Script 網址已失效（404）。請重新部署後更新程式內建網址。"
          );
        }
        data = parseAppsScriptJson(rawText);
      } catch (err) {
        if (err && err.message && err.message.includes("Apps Script")) throw err;
      }
      if (data && data.ok === false) {
        throw new Error(
          `${data.error || "寫入失敗"}（腳本 ver ${
            data.ver != null ? data.ver : "？"
          } / ${data.writeMode || "unknown"}）`
        );
      }
      if (data && data.ok && Number(data.ver) >= 6) {
        // 新版已逐格寫入；以回傳為準，並同步本機快取
        rememberBankRow(cols);
        // 背景重讀 A 欄索引
        loadBankIndexFromSheet().catch(() => {});
        return data;
      }
      if (data && data.ok && data.ver != null && Number(data.ver) < 6) {
        throw new Error(
          `寫入服務仍是舊版（ver ${data.ver}）。請刪除專案裡多餘的 .gs，只留最新 VocabBank，並部署「新版本」。`
        );
      }
      // 無 JSON／無 ver：可能打到舊 doPost 或轉址失敗
      await new Promise((r) => setTimeout(r, 1200));
      try {
        await loadBankIndexFromSheet();
      } catch (e) {}
      const key = bankKey(cols[0]);
      let saved = bankDetails.get(key);
      if (!saved && bankIndex.has(key)) {
        try {
          saved = await loadBankDetailFromSheet(bankIndex.get(key));
          if (saved) bankDetails.set(key, saved);
        } catch (e) {}
      }
      const looksSaved = saved && saved.slice(1).some((c) => c);
      if (!looksSaved) {
        const snippet = String(rawText || "")
          .replace(/\s+/g, " ")
          .slice(0, 160);
        throw new Error(
          `儲存未成功（回應無 ver）。請檢查 Apps Script 是否有多個 doPost。回應片段：${snippet}`
        );
      }
      rememberBankRow(cols);
      return data || { ok: true };
    }

    function renderPool(terms) {
      els.sub.textContent = `共 ${terms.length} 個語詞`;
      els.list.innerHTML = "";
      if (!terms.length) {
        els.list.innerHTML =
          '<p class="empty">語詞庫是空的，請先在遊戲中點選常用語詞加入。</p>';
        return;
      }
      terms.forEach((term) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "term";
        btn.dataset.term = term;
        btn.textContent = term;
        if (bankIndex.has(bankKey(term))) btn.classList.add("saved");
        btn.addEventListener("click", async () => {
          document.querySelectorAll(".term").forEach((b) => b.classList.remove("active"));
          btn.classList.add("active");
          const key = bankKey(term);
          if (bankIndex.has(key)) {
            let cols = bankDetails.get(key);
            if (!cols) {
              els.status.textContent = `正在載入「${plainTerm(term)}」…`;
              try {
                cols = await loadBankDetailFromSheet(bankIndex.get(key));
                if (cols) bankDetails.set(key, cols);
              } catch (err) {
                console.error(err);
                els.status.textContent = `載入失敗：${err.message}`;
                return;
              }
            }
            if (cols && cols.slice(1).some((c) => String(c || "").trim())) {
              showDetail(
                term,
                cols,
                "來源：試算表（可修改後再覆蓋）",
                false
              );
              els.status.textContent = `已載入「${plainTerm(term)}」。若要更新，可複製給 Gemini 後貼回並覆蓋。`;
              currentPrompt = "";
              return;
            }
          }
          showDetail(term, null, "試算表尚無此語詞，請用 Gemini 生成後貼上儲存", true);
          els.status.textContent = `「${plainTerm(term)}」尚未建檔。`;
          await askGemini(term);
        });
        els.list.appendChild(btn);
      });
    }

    els.askGeminiBtn.addEventListener("click", async () => {
      if (!currentTerm) return;
      currentPrompt = buildPrompt(currentTerm);
      const ok = await copyText(currentPrompt);
      els.status.textContent = ok
        ? "提示詞已複製。請到 Gemini 視窗貼上（Cmd/Ctrl+V）送出。"
        : "複製失敗，請再按一次「複製給 Gemini」。";
    });

    els.toneozBtn.addEventListener("click", () => {
      window.open("https://toneoz.com/imez", "_blank", "noopener,noreferrer");
    });

    els.copyAllBtn.addEventListener("click", async () => {
      try {
        await copyAllPoolToClipboard();
      } catch (err) {
        console.error(err);
        els.status.textContent = `複製失敗：${err.message}`;
      } finally {
        els.copyAllBtn.disabled = false;
      }
    });

    els.saveSheetBtn.addEventListener("click", async () => {
      try {
        const cols = parseHashRow(els.geminiPaste.value, currentTerm);
        if (!cols[0]) throw new Error("找不到語詞");
        if (!cols.slice(1).some(Boolean)) {
          throw new Error("請先貼上 Gemini 回覆（# 分隔）");
        }
        els.status.textContent = "寫入試算表中…";
        await saveToSheet(cols);
        currentCols = cols;
        showDetail(currentTerm || cols[0], cols, "來源：已寫入試算表（可再修改覆蓋）", false);
        els.status.textContent = `已覆蓋「${cols[0]}」回試算表。`;
      } catch (err) {
        console.error(err);
        els.status.textContent = `儲存失敗：${err.message}`;
      }
    });

    async function pingScriptUrl(url) {
      if (!url) return false;
      try {
        const res = await fetch(url + (url.includes("?") ? "&" : "?") + "action=ping", {
          cache: "no-store",
        });
        const text = await res.text();
        if (res.status === 404 || /檔案不存在|does not exist|Sorry/i.test(text)) return false;
        const data = JSON.parse(text);
        return !!(data && data.ok);
      } catch {
        return false;
      }
    }

    async function init() {
      const terms = loadPoolTerms();
      renderPool(terms);
      els.status.textContent = "正在讀取試算表語詞庫…";
      try {
        await loadBankIndexFromSheet();
        markSavedTerms();
        els.status.textContent = `試算表已載入 ${bankIndex.size} 筆語詞（僅 A 欄索引）。`;
      } catch (err) {
        console.error(err);
        els.status.textContent =
          "試算表讀取失敗（仍可複製給 Gemini）。請確認試算表為「知道連結者可檢視/編輯」。";
      }
      try {
        const res = await fetch(
          SCRIPT_URL + (SCRIPT_URL.includes("?") ? "&" : "?") + "action=ping",
          { cache: "no-store" }
        );
        const raw = await res.text();
        const data = parseAppsScriptJson(raw);
        if (data && data.ok && data.ver != null) {
          if (Number(data.ver) < 6) {
            els.status.textContent +=
              " ※請改部署 VocabBank v6（並刪除專案裡其他含 doPost 的舊檔）。";
          }
        } else if (data && data.ok) {
          const snip = raw.replace(/\s+/g, " ").slice(0, 120);
          els.status.textContent +=
            ` ※寫入服務無 ver（目前內建網址回傳：${snip}）。請用「管理部署→編輯→新版本」更新同一個 /exec，或把有 ver:6 的新網址貼給我替換。`;
        } else {
          els.status.textContent +=
            " ※寫入服務 ping 無法解析，自動存檔可能失敗。";
        }
      } catch (e) {
        els.status.textContent +=
          " ※ 寫入服務連線異常，自動存檔可能失敗。";
      }
    }

    init();
  </script>
</body>
