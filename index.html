<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>猜字拼圖</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=30" />
</head>
<body>
  <div class="bg-wash" aria-hidden="true"></div>

  <!-- 選單畫面 -->
  <main id="setup" class="screen setup-screen">
    <header class="brand">
      <p class="brand-mark">猜字拼圖</p>
      <p class="brand-sub">點開拼圖，慢慢露出底下的字</p>
    </header>

    <section class="setup-panel" aria-labelledby="setup-title">
      <h1 id="setup-title" class="visually-hidden">選擇單元</h1>

      <label class="field">
        <span class="field-label">冊別</span>
        <select id="book-select" disabled>
          <option value="">讀取中…</option>
        </select>
      </label>

      <label class="field">
        <span class="field-label">單元</span>
        <select id="unit-select" disabled>
          <option value="">請先選擇冊別</option>
        </select>
      </label>

      <p id="preview" class="preview" aria-live="polite"></p>

      <div class="setup-actions">
        <button id="start-btn" class="btn btn-primary" type="button" disabled>
          開始教學（全螢幕）
        </button>
        <button id="reload-btn" class="btn btn-ghost" type="button">重新載入試算表</button>
      </div>

      <div class="book-links" aria-label="各冊直接進入網址">
        <p class="field-label">各冊一鍵複製網址</p>
        <div id="book-link-list" class="book-link-list"></div>
      </div>

      <p id="status" class="status" role="status"></p>
    </section>
  </main>

  <!-- 教學全螢幕 -->
  <section id="teach" class="screen teach-screen" hidden>
    <header class="teach-bar">
      <div class="teach-bar-left">
        <button id="menu-btn" class="btn btn-ghost teach-menu-btn" type="button">回選單</button>
        <div class="teach-meta">
          <span id="teach-unit" class="chip"></span>
          <span id="teach-progress" class="chip chip-muted"></span>
        </div>
      </div>
    </header>

    <div class="teach-body">
      <div class="stage-wrap">
        <div id="board" class="board" aria-label="猜字拼圖板">
          <div id="char-layer" class="char-layer" aria-hidden="true">
            <span class="char-base">永</span>
            <span class="char-radical">永</span>
          </div>
          <div id="tiles" class="tiles" role="group" aria-label="拼圖片"></div>
        </div>
        <p id="hint" class="hint">點選彩色拼圖，露出底下的字</p>
      </div>

      <aside class="teach-actions" aria-label="教學操作">
        <button id="next-btn" class="btn btn-primary" type="button">下一字</button>
        <button id="reveal-btn" class="btn btn-soft" type="button">全部揭開</button>
        <div class="auto-reveal-group">
          <button id="auto-reveal-btn" class="btn btn-soft" type="button">自動依序揭開</button>
          <button id="stop-auto-btn" class="btn btn-ghost" type="button" hidden>關閉自動</button>
          <label class="speed-stick" for="reveal-speed">
            <span class="speed-end" aria-hidden="true">慢</span>
            <input
              id="reveal-speed"
              type="range"
              min="1"
              max="10"
              value="4"
              step="1"
              aria-label="揭開速度"
            />
            <span class="speed-end" aria-hidden="true">快</span>
          </label>
        </div>
        <div id="fab-stack" class="teach-side-tools">
          <button id="vocab-btn" class="btn btn-soft teach-tool-btn" type="button">常用語詞</button>
          <button id="term-pool-fab" class="btn btn-soft teach-tool-btn teach-tool-pool" type="button">語詞庫（0）</button>
        </div>
        <button id="exit-btn" class="btn btn-ghost" type="button" aria-pressed="false">進入全螢幕</button>
      </aside>
    </div>

    <div id="answer-toast" class="answer-toast" hidden>
      <span>答案是</span>
      <strong id="answer-char"></strong>
    </div>

    <div id="done-overlay" class="done-overlay" hidden>
      <canvas id="confetti-canvas" class="confetti-canvas" aria-hidden="true"></canvas>
      <div class="celebrate-panel">
        <div class="celebrate-banner" role="status">
          <p class="celebrate-text">You did it</p>
        </div>
        <div class="celebrate-actions">
          <button id="prev-unit-btn" class="btn btn-soft" type="button">上一單元</button>
          <button id="replay-unit-btn" class="btn btn-primary" type="button">再一次</button>
          <button id="next-unit-btn" class="btn btn-soft" type="button">下一單元</button>
        </div>
        <button id="term-pool-btn" class="btn btn-soft celebrate-pool" type="button">語詞庫（0）</button>
        <button id="done-menu-btn" class="btn btn-ghost celebrate-menu" type="button">回主選單</button>
      </div>
    </div>

    <aside id="vocab-panel" class="vocab-panel" hidden>
      <header class="vocab-panel-head">
        <div>
          <p class="vocab-panel-title">常用語詞</p>
          <p id="vocab-panel-sub" class="vocab-panel-sub">含「—」的語詞</p>
        </div>
        <button id="vocab-close-btn" class="btn btn-ghost" type="button">關閉</button>
      </header>
      <p id="vocab-status" class="vocab-status" role="status"></p>
      <div id="vocab-list" class="vocab-list"></div>
    </aside>
  </section>

  <script src="app.js?v=37"></script>
</body>
</html>
